name: 功能建议 / Feature request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望的做法
  - type: textarea
    id: other
    attributes:
      label: 其他信息
      description: 参考的其他面板、截图等
