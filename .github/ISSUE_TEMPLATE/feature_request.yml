name: 功能建议 / Feature request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem should it solve
      description: 现在哪里不方便？/ What is inconvenient today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望的做法 / Proposed solution
  - type: textarea
    id: other
    attributes:
      label: 其他信息 / Anything else
      description: 参考的其他面板、截图等 / other panels, screenshots …
