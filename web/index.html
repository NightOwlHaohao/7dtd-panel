<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="NightowlHaohao">
  <meta name="color-scheme" content="light dark">
  <title>七日杀服务器面板</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipMain">跳到主要内容</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航" data-i18n-aria-label="navLabel">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <strong data-i18n="appName">七日杀面板</strong>
          <small data-i18n="appTagline">本地服务器管理</small>
        </span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <label class="field field-compact">
          <span data-i18n="language">语言</span>
          <select id="language">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="field field-compact">
          <span data-i18n="theme">主题</span>
          <select id="theme">
            <option value="system" data-i18n="themeSystem">跟随系统</option>
            <option value="light" data-i18n="themeLight">浅色</option>
            <option value="dark" data-i18n="themeDark">深色</option>
          </select>
        </label>
        <p class="sidebar-credit"><span data-i18n="author">作者 NightowlHaohao</span><span id="app-version"></span></p>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-toggle" aria-controls="sidebar" aria-expanded="false" data-i18n-aria-label="openMenu" aria-label="打开菜单"></button>
        <h1 id="page-title" class="page-title"></h1>
        <div class="topbar-status" id="topbar-status" aria-live="polite"></div>
        <button class="button button-ghost console-toggle" id="console-toggle" aria-controls="console-drawer" aria-expanded="false">
          <span class="console-toggle-icon" aria-hidden="true"></span>
          <span data-i18n="console">控制台</span>
          <span class="count-badge" id="console-badge" hidden></span>
        </button>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <section id="console-drawer" class="console-drawer" hidden aria-labelledby="console-title">
    <div id="console-resize" class="console-resize" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-aria-label="consoleResize" aria-label="调整控制台高度"></div>
    <div class="console-toolbar">
      <h2 id="console-title" data-i18n="console">控制台</h2>
      <label class="field field-inline"><span data-i18n="consoleChannel">频道</span>
        <select id="console-channel">
          <option value="game" data-i18n="channel_game">游戏</option>
          <option value="panel" data-i18n="channel_panel">面板</option>
          <option value="steamcmd" data-i18n="channel_steamcmd">SteamCMD</option>
          <option value="telnet" data-i18n="channel_telnet">Telnet</option>
          <option value="ops" data-i18n="channel_ops">操作</option>
        </select>
      </label>
      <label class="field field-inline"><span data-i18n="consoleLevel">级别</span>
        <select id="console-level">
          <option value="all" data-i18n="level_all">全部</option>
          <option value="info" data-i18n="level_info">信息</option>
          <option value="warn" data-i18n="level_warn">警告</option>
          <option value="error" data-i18n="level_error">错误</option>
          <option value="command" data-i18n="level_command">命令</option>
          <option value="output" data-i18n="level_output">返回</option>
        </select>
      </label>
      <div class="toolbar-spacer"></div>
      <button class="button button-ghost" id="console-pause" data-i18n="consolePause">暂停</button>
      <button class="button button-ghost" id="console-copy" data-i18n="copy">复制</button>
      <button class="button button-ghost" id="console-clear" data-i18n="consoleClear">清空</button>
      <button class="icon-button" id="console-close" data-i18n-aria-label="consoleClose" aria-label="关闭控制台"></button>
    </div>
    <pre id="console-log" class="log console-log" tabindex="0"></pre>
    <form id="console-form" class="console-form">
      <label class="field field-grow"><span data-i18n="telnetCommand">Telnet 命令</span>
        <input id="console-command" autocomplete="off" maxlength="500" spellcheck="false">
      </label>
      <button class="button button-primary" data-i18n="send">发送</button>
      <p id="console-feedback" class="field-feedback" role="status"></p>
    </form>
  </section>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="button button-secondary" value="cancel" data-i18n="cancel">取消</button>
        <button class="button button-primary" value="confirm" id="confirm-accept"></button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
